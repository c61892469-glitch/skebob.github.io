<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skebob.vip - Profile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238acc14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2' ry='2'%3E%3C/rect%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'%3E%3C/path%3E%3C/svg%3E">
    <style>
        :root { --bg-deep: #0e0e0e; --bg-box: #222222; --bg-header: #2c2c2c; --bg-nav: #2a2a2a; --bg-input: #1a1a1a; --border-dark: #111111; --border-light: #333333; --text-main: #cccccc; --text-muted: #aaaaaa; --legend-blue: #5b84a9; --accent-green: #8acc14; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Verdana, Arial, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; font-size: 11px; }
        .top-line { height: 2px; width: 100%; background: linear-gradient(90deg, #111 0%, var(--accent-green) 50%, #111 100%); position: fixed; top: 0; left: 0; z-index: 1000; }
        .forum-wrapper { width: 95%; max-width: 960px; margin: 25px auto 40px auto; }
        .f-box { background: var(--bg-box); border: 1px solid var(--border-dark); margin-bottom: 12px; border-radius: 2px; }
        .f-header { background: var(--bg-header); padding: 7px 12px; font-weight: bold; color: #dddddd; border-bottom: 1px solid var(--border-dark); font-size: 11px; }
        .f-content { padding: 14px 18px; border-top: 1px solid var(--border-light); }
        .f-nav { background: var(--bg-nav); border: 1px solid var(--border-dark); padding: 6px 12px; display: flex; gap: 12px; font-size: 10px; margin-top: 10px; margin-bottom: 8px; justify-content: space-between; align-items: center; }
        .f-nav-links { display: flex; gap: 12px; }
        .f-nav a { color: var(--text-main); text-decoration: none; font-size: 10px; }
        .f-nav a:hover, .f-nav a.active { color: #ffffff; text-decoration: underline; font-weight: bold; }
        .f-fieldset { border: 1px solid var(--border-light); padding: 10px 14px; margin-bottom: 12px; border-radius: 2px; }
        .f-legend { color: var(--legend-blue); padding: 0 4px; font-size: 10px; margin-left: 5px; }
        .f-label { font-weight: bold; display: block; margin-bottom: 4px; color: #cccccc; font-size: 10px; }
        .f-input { background: var(--bg-input); border: 1px solid #000000; color: #eeeeee; padding: 4px 6px; width: 100%; max-width: 250px; outline: none; font-size: 10px; }
        .f-btn { background: linear-gradient(to bottom, #2a2a2a, #1a1a1a); color: #cccccc; border: 1px solid #000000; border-radius: 2px; padding: 4px 12px; font-weight: bold; cursor: pointer; font-size: 10px; }
        .f-btn:hover { background: linear-gradient(to bottom, #333333, #222222); color: #ffffff; }
        .profile-card { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; background: #1a1a1a; padding: 8px; border: 1px solid #000000; }
        .profile-avatar { width: 48px; height: 48px; border: 1px solid #000000; object-fit: cover; background: #000; }
        .sub-item { background: #1a1a1a; border: 1px solid #000; padding: 6px 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
    </style>
</head>
<body>
    <div class="top-line"></div>
    <div class="forum-wrapper">
        <div class="f-box">
            <div class="f-content" style="padding: 10px 14px;">
                <div style="font-size: 22px; cursor: pointer;" onclick="location.href='index.html'">
                    <span style="color: #fff;">skebob</span><span style="color: #8acc14;">.vip</span>
                </div>
                <div class="f-nav">
                    <div class="f-nav-links">
                        <a href="index.html">Index</a>
                        <a href="forum.html">Forums & Configs</a>
                        <a href="profile.html" class="active">User Control Panel</a>
                    </div>
                    <div><a href="rules.html" style="color: var(--accent-green);">Rules</a></div>
                </div>
            </div>
        </div>

        <div class="f-box">
            <div class="f-header">User Control Panel</div>
            <div class="f-content">
                <div class="profile-card">
                    <img id="profileAvatar" src="https://via.placeholder.com/48/000000/8acc14?text=U" class="profile-avatar">
                    <div>
                        <div style="font-weight: bold; color: #ffffff;" id="userDisplayTitle">User</div>
                        <div style="color: var(--accent-green); font-size: 10px;" id="userStatusText">Status: Active Member</div>
                    </div>
                </div>

                <!-- ПАНЕЛЬ АДМИНА ДЛЯ ОДОБРЕНИЯ ЗАЯВОк -->
                <fieldset class="f-fieldset" id="adminPanelSection" style="display: none; border-color: var(--accent-green);">
                    <legend class="f-legend" style="color: var(--accent-green);">Модерация заявок на конфиги</legend>
                    <div id="adminSubmissionsList" style="margin-bottom: 10px;">Загрузка заявок...</div>
                    <button class="f-btn" id="adminGenBtn">Сгенерировать инвайт-код</button>
                    <input type="text" class="f-input" id="adminGeneratedInviteInput" readonly placeholder="Кликни для создания" style="margin-top: 5px;">
                </fieldset>

                <!-- МОИ ЗАЯВКИ -->
                <fieldset class="f-fieldset">
                    <legend class="f-legend">История моих заявок на форум</legend>
                    <div id="mySubmissionsList">Загрузка...</div>
                </fieldset>

                <fieldset class="f-fieldset">
                    <legend class="f-legend">Настройки профиля</legend>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <div><label class="f-label">Новый никнейм</label><input type="text" class="f-input" id="nicknameInput"></div>
                        <div><label class="f-label">Аватарка с ПК</label><input type="file" class="f-input" id="avatarFileInput" accept="image/*"></div>
                    </div>
                    <button class="f-btn" style="margin-top: 10px;" id="saveProfileBtn">Сохранить изменения</button>
                </fieldset>
                <button class="f-btn" style="color: #ff5555;" id="logoutBtn">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10", authDomain: "skebob-vip-4aa40.firebaseapp.com", projectId: "skebob-vip-4aa40", storageBucket: "skebob-vip-4aa40.firebasestorage.app", messagingSenderId: "853888273098", appId: "1:853888273098:web:d46ec3bbb556693edd4233" });
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if(!user) { location.href = 'login.html'; return; }
            document.getElementById('userDisplayTitle').textContent = user.displayName || user.email;
            
            const userSnap = await getDoc(doc(db, "users", user.uid));
            if(userSnap.exists()) {
                const data = userSnap.data();
                if(data.photoURL) document.getElementById('profileAvatar').src = data.photoURL;
                if(data.role === 'admin') {
                    document.getElementById('adminPanelSection').style.display = 'block';
                    document.getElementById('userStatusText').textContent = "Status: Administrator";
                    loadAdminSubmissions();
                }
            }
            loadMySubmissions(user.uid);
        });

        async function loadMySubmissions(uid) {
            const q = query(collection(db, "submissions"), where("uid", "==", uid));
            const snap = await getDocs(q);
            let html = '';
            snap.forEach(d => {
                const data = d.data();
                let statusColor = '#aaa';
                let statusText = 'На проверке';
                if(data.status === 'approved') { statusColor = '#88ff9e'; statusText = 'Одобрено'; }
                if(data.status === 'rejected') { statusColor = '#ff8888'; statusText = 'Отклонено (нет скринов/описания)'; }
                
                html += `<div class="sub-item"><div><b>${data.title}</b> (${data.software})</div><div style="color:${statusColor};">${statusText}</div></div>`;
            });
            document.getElementById('mySubmissionsList').innerHTML = html || 'Ты пока ничего не заливал.';
        }

        async function loadAdminSubmissions() {
            const q = query(collection(db, "submissions"), where("status", "==", "pending"));
            const snap = await getDocs(q);
            let html = '';
            snap.forEach(d => {
                const data = d.data();
                html += `
                    <div class="sub-item" style="flex-direction:column; align-items:flex-start; gap:4px;">
                        <div><b>${data.title}</b> от ${data.author} (${data.software})</div>
                        <div style="color:#aaa;">Описание: ${data.desc}</div>
                        <div><a href="${data.link}" target="_blank" style="color:var(--legend-blue);">Ссылка на файл</a></div>
                        <div style="display:flex; gap:6px; margin-top:4px;">
                            <button class="f-btn" style="background:#132d16; color:#88ff9e;" onclick="reviewSub('${d.id}', 'approved')">Одобрить</button>
                            <button class="f-btn" style="background:#2d1313; color:#ff8888;" onclick="reviewSub('${d.id}', 'rejected')">Отклонить</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('adminSubmissionsList').innerHTML = html || 'Нет новых заявок.';
        }

        window.reviewSub = async function(id, status) {
            await updateDoc(doc(db, "submissions", id), { status });
            alert('Статус изменен!');
            location.reload();
        }

        document.getElementById('saveProfileBtn').onclick = async () => {
            const user = auth.currentUser;
            const fileInput = document.getElementById('avatarFileInput');
            const nickname = document.getElementById('nicknameInput').value.trim();
            
            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = 100; canvas.height = 100;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 100, 100);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        await setDoc(doc(db, "users", user.uid), { photoURL: dataUrl, ...(nickname ? { displayName: nickname } : {}) }, { merge: true });
                        if(nickname) await updateProfile(user, { displayName: nickname });
                        location.reload();
                    }
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else if(nickname) {
                await updateProfile(user, { displayName: nickname });
                await setDoc(doc(db, "users", user.uid), { displayName: nickname }, { merge: true });
                location.reload();
            }
        };

        document.getElementById('adminGenBtn').onclick = async () => {
            const code = 'SKEBOB-ADMIN-' + Math.random().toString(36).substring(2, 8).toUpperCase();
            await setDoc(doc(db, "invites", code), { used: false, createdBy: auth.currentUser.uid, createdAt: Date.now() });
            document.getElementById('adminGeneratedInviteInput').value = code;
        };

        document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); location.href = 'login.html'; };
    </script>
</body>
</html>
