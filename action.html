<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skebob.vip - Email Verification</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238acc14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2' ry='2'%3E%3C/rect%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'%3E%3C/path%3E%3C/svg%3E">
    <style>
        :root {
            --bg-deep: #0e0e0e; --bg-box: #222222; --bg-header: #2c2c2c; --bg-nav: #2a2a2a;
            --bg-input: #1a1a1a; --border-dark: #111111; --border-light: #333333;
            --text-main: #cccccc; --text-muted: #aaaaaa; --accent-green: #8acc14; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Verdana, Arial, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; padding: 25px 0; font-size: 11px; }
        .top-line { height: 2px; width: 100%; background: linear-gradient(90deg, #111 0%, var(--accent-green) 50%, #111 100%); position: fixed; top: 0; left: 0; z-index: 1000; }
        .forum-wrapper { width: 95%; max-width: 960px; margin: 0 auto; }
        .f-box { background: var(--bg-box); border: 1px solid var(--border-dark); margin-bottom: 12px; border-radius: 2px; }
        .f-header { background: var(--bg-header); padding: 7px 12px; font-weight: bold; color: #dddddd; border-bottom: 1px solid var(--border-dark); font-size: 11px; }
        .f-content { padding: 14px 18px; border-top: 1px solid var(--border-light); }
        .f-nav { background: var(--bg-nav); border: 1px solid var(--border-dark); padding: 6px 12px; display: flex; gap: 12px; font-size: 10px; margin-top: 10px; margin-bottom: 8px; }
        .f-nav a { color: var(--text-main); text-decoration: none; font-size: 10px; }
        .f-nav a:hover { color: #ffffff; text-decoration: underline; }
        .f-btn { background: linear-gradient(to bottom, #2a2a2a, #1a1a1a); color: #cccccc; border: 1px solid #000000; border-radius: 2px; padding: 4px 12px; font-weight: bold; cursor: pointer; font-size: 10px; display: inline-block; margin-top: 10px; text-decoration: none; }
        .f-btn:hover { background: linear-gradient(to bottom, #333333, #222222); color: #ffffff; }
        .f-error-msg { display: none; background: #2d1313; border: 1px solid #752222; color: #ff8888; padding: 8px 12px; font-size: 10px; margin-bottom: 12px; border-radius: 2px; }
        .f-success-msg { display: none; background: #132d16; border: 1px solid #22752a; color: #88ff9e; padding: 8px 12px; font-size: 10px; margin-bottom: 12px; border-radius: 2px; }
        .info-box { background: var(--bg-input); border: 1px solid var(--border-light); padding: 10px; margin-bottom: 12px; color: var(--text-main); line-height: 1.5; }
    </style>
</head>
<body>
    <div class="top-line"></div>
    <div class="forum-wrapper">
        <div class="f-box">
            <div class="f-content" style="padding: 10px 14px;">
                <div style="font-size: 22px; cursor: pointer;" onclick="location.href='index.html'">
                    <span style="color: #fff;">skebob</span><span style="color: #8acc14;">.vip</span>
                </div>
                <div class="f-nav">
                    <a href="index.html">Index</a>
                    <a href="register.html">Register</a>
                    <a href="login.html">Login</a>
                </div>
                <div class="f-status">Account Activation</div>
            </div>
        </div>
        <div class="f-box">
            <div class="f-header">Email Verification & Auto-Login</div>
            <div class="f-content">
                <div class="info-box" id="statusBox">
                    Verifying your email address and logging you in, please wait...
                </div>
                <div class="f-error-msg" id="actionErrorMsg"></div>
                <div class="f-success-msg" id="actionSuccessMsg"></div>
                <div id="actionButtons" style="display: none;">
                    <a href="index.html" class="f-btn">Go to Forum Index</a>
                    <a href="login.html" class="f-btn">Go to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, applyActionCode, checkActionCode } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showError(msg) {
            const el = document.getElementById('actionErrorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('statusBox').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('actionSuccessMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('statusBox').style.display = 'none';
            document.getElementById('actionButtons').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const actionCode = urlParams.get('oobCode');

            if (mode === 'verifyEmail' && actionCode) {
                try {
                    // 1. Узнаем почту, к которой относится этот код, до подтверждения
                    const info = await checkActionCode(auth, actionCode);
                    const verifiedEmail = info.data.email;

                    // 2. Подтверждаем почту в Firebase
                    await applyActionCode(auth, actionCode);
                    
                    showSuccess(`Email (${verifiedEmail}) successfully verified! You are now logged in / ready to enter.`);

                    // 3. Автоматически перенаправляем на главную страницу через 1.5 секунды
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);

                } catch (error) {
                    showError('Verification failed: ' + error.message + '. The link might be expired or already used.');
                }
            } else {
                showError('Invalid or missing verification parameters in the link.');
            }
        });
    </script>
</body>
</html>
