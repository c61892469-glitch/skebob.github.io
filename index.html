<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root { --bg-deep: #0e0e0e; --bg-box: #222222; --bg-header: #2c2c2c; --bg-nav: #2a2a2a; --border-dark: #111111; --border-light: #333333; --text-main: #cccccc; --text-muted: #aaaaaa; --legend-blue: #5b84a9; --accent-green: #8acc14; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Verdana, Arial, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; font-size: 11px; }
        .top-line { height: 2px; width: 100%; background: linear-gradient(90deg, #111 0%, var(--accent-green) 50%, #111 100%); position: fixed; top: 0; left: 0; z-index: 1000; }
        .forum-wrapper { width: 95%; max-width: 960px; margin: 25px auto 40px auto; }
        .f-box { background: var(--bg-box); border: 1px solid var(--border-dark); margin-bottom: 12px; border-radius: 2px; }
        .f-header { background: var(--bg-header); padding: 7px 12px; font-weight: bold; color: #dddddd; border-bottom: 1px solid var(--border-dark); font-size: 11px; }
        .f-content { padding: 14px 18px; border-top: 1px solid var(--border-light); }
        .f-nav { background: var(--bg-nav); border: 1px solid var(--border-dark); padding: 6px 12px; display: flex; gap: 12px; font-size: 10px; margin-top: 10px; margin-bottom: 8px; }
        .f-nav a { color: var(--text-main); text-decoration: none; font-size: 10px; }
        .f-nav a:hover, .f-nav a.active { color: #ffffff; text-decoration: underline; font-weight: bold; }
        .f-status { color: #bbbbbb; font-size: 10px; }
        .f-fieldset { border: 1px solid var(--border-light); padding: 10px 14px; margin-bottom: 12px; border-radius: 2px; }
        .f-legend { color: var(--legend-blue); padding: 0 4px; font-size: 10px; margin-left: 5px; }
        .f-text { color: var(--text-muted); font-size: 10px; margin-top: 3px; margin-bottom: 3px; line-height: 1.4; }
        .f-btn { background: linear-gradient(to bottom, #2a2a2a, #1a1a1a); color: #cccccc; border: 1px solid #000000; border-radius: 2px; padding: 4px 12px; font-weight: bold; cursor: pointer; font-size: 10px; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .f-btn:hover { background: linear-gradient(to bottom, #333333, #222222); color: #ffffff; }
        .f-error-msg { display: none; background: #2d1313; border: 1px solid #752222; color: #ff8888; padding: 8px 12px; font-size: 10px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="top-line"></div>
    <div class="forum-wrapper">
        <div class="f-box">
            <div class="f-content" style="padding: 10px 14px;">
                <div style="font-size: 22px; cursor: pointer;" onclick="location.href='index.html'">
                    <span style="color: #fff;">skebob</span><span style="color: #8acc14;">.vip</span>
                </div>
                <div class="f-nav" id="navBar"></div>
                <div class="f-status" id="statusText">Checking session...</div>
            </div>
        </div>

        <div class="f-box">
            <div class="f-header">Information & Downloads</div>
            <div class="f-content">
                <div id="indexLoggedOut" style="display: none;">
                    <div class="f-text" style="color: #cccccc; margin-bottom: 8px;">You do not have permission to view these forums.</div>
                    <a href="login.html" style="color: var(--legend-blue); text-decoration: none;">Sign in to continue</a>
                </div>
                <div id="indexLoggedIn" style="display: none;">
                    <fieldset class="f-fieldset">
                        <legend class="f-legend">skebob.vip Loader & Scripts</legend>
                        <div class="f-text" style="margin-bottom: 10px;">Welcome to skebob.vip. Download your scripts and configs below.</div>
                        <a href="#" id="downloadBtn" class="f-btn">Download LUA Script</a>
                    </fieldset>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        
        const app = initializeApp({ apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10", authDomain: "skebob-vip-4aa40.firebaseapp.com", projectId: "skebob-vip-4aa40", storageBucket: "skebob-vip-4aa40.firebasestorage.app", messagingSenderId: "853888273098", appId: "1:853888273098:web:d46ec3bbb556693edd4233" });
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            const navBar = document.getElementById('navBar');
            if (user) {
                navBar.innerHTML = `<a href="index.html" class="active">Index</a><a href="forum.html">Forums & Configs</a><a href="profile.html">User Control Panel</a>`;
                document.getElementById('statusText').textContent = `Welcome back, ${user.displayName || user.email}`;
                document.getElementById('indexLoggedIn').style.display = 'block';
                document.getElementById('indexLoggedOut').style.display = 'none';
            } else {
                navBar.innerHTML = `<a href="index.html" class="active">Index</a><a href="register.html">Register</a><a href="login.html">Login</a>`;
                document.getElementById('statusText').textContent = `You are not logged in.`;
                document.getElementById('indexLoggedIn').style.display = 'none';
                document.getElementById('indexLoggedOut').style.display = 'block';
            }
        });

        document.getElementById('downloadBtn').onclick = async (e) => {
            e.preventDefault();
            const fileUrl = 'https://raw.githubusercontent.com/c6189246-glitch/skebob.github.io/main/script.lua';
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'skebob_trashtalk.lua';
                document.body.appendChild(a); a.click(); a.remove();
            } catch(err) { window.open(fileUrl, '_blank'); }
        };
    </script>
</body>
</html>
