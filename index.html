<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skebob.vip</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAALElEQVQ4T2NkwAIYoZgBwxj/48EcRgaGBhDjkAGwGQOgzgBlwKgDM0A1AwBy3AUF7UvPqAAAAABJRU5ErkJggg==">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0b0b; color: #d1d5db; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        .rgb-line { height: 3px; width: 100%; background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); background-size: 400% 400%; animation: rgbAnimation 8s ease infinite; position: fixed; top: 0; left: 0; z-index: 1000; }
        @keyframes rgbAnimation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .auth-nav { position: fixed; top: 15px; right: 25px; display: flex; gap: 15px; z-index: 100; font-size: 0.85rem; }
        .auth-nav a { color: #9ca3af; text-decoration: none; transition: color 0.2s; cursor: pointer; }
        .auth-nav a:hover { color: #ffffff; }

        .container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .brand-title { font-size: 3.5rem; font-weight: 400; letter-spacing: -0.5px; color: #ffffff; }
        .brand-title span { color: #76b900; }

        .download-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .download-btn { background: #141414; border: 1px solid #222; color: #9ca3af; padding: 10px 22px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; text-decoration: none; transition: all 0.2s ease; }
        .download-btn:hover { background: #1c1c1c; color: #ffffff; border-color: #333; transform: translateY(-2px); }
        .download-btn svg { stroke: currentColor; }

        .modal-overlay, .dashboard-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 11, 11, 0.95); z-index: 500; justify-content: center; align-items: center; flex-direction: column; }
        .modal-box { background: #141414; border: 1px solid #222; padding: 30px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .modal-box h2 { font-size: 1.2rem; color: #fff; margin-bottom: 5px; }
        .modal-box input { background: #0b0b0b; border: 1px solid #222; padding: 10px; border-radius: 4px; color: #fff; font-size: 0.9rem; outline: none; }
        .modal-box input:focus { border-color: #76b900; }
        .modal-box button { background: #76b900; color: #000; border: none; padding: 10px; border-radius: 4px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .modal-box button:hover { opacity: 0.9; }
        .modal-box .close-link { font-size: 0.8rem; color: #777; text-align: center; cursor: pointer; text-decoration: none; }
        .modal-box .close-link:hover { color: #fff; }

        .dashboard-content { background: #141414; border: 1px solid #222; padding: 30px; border-radius: 8px; width: 450px; display: flex; flex-direction: column; gap: 20px; position: relative; }
        .profile-header { display: flex; align-items: center; gap: 20px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #76b900; object-fit: cover; background: #0b0b0b; }
        .profile-info { display: flex; flex-direction: column; gap: 5px; }
        .profile-info h2 { color: #fff; font-size: 1.2rem; margin: 0; word-break: break-all; }
        .vip-badge { background: rgba(118, 185, 0, 0.15); color: #76b900; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; border: 1px solid #76b900; align-self: flex-start; letter-spacing: 0.5px; }
        .profile-settings { border-top: 1px solid #222; padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .profile-settings input { background: #0b0b0b; border: 1px solid #222; padding: 10px; border-radius: 4px; color: #fff; font-size: 0.9rem; outline: none; }
        .profile-settings input:focus { border-color: #76b900; }
        .save-btn { background: #1c1c1c; color: #9ca3af; border: 1px solid #333; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .save-btn:hover { background: #76b900; color: #000; border-color: #76b900; }
        .logout-btn { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #ef4444; color: #fff; }
        
        .close-dashboard { position: absolute; top: 15px; right: 20px; color: #777; cursor: pointer; font-size: 1.5rem; transition: 0.2s; z-index: 10; }
        .close-dashboard:hover { color: #fff; }

        /* ОБНОВЛЕННЫЕ СТИЛИ ФОРУМА (С МЕНЮ) */
        .forum-content { 
            background: #141414; border: 1px solid #222; border-radius: 8px; 
            width: 850px; height: 80vh; display: flex; flex-direction: row; position: relative; overflow: hidden;
        }
        .forum-sidebar {
            width: 220px; background: #0b0b0b; border-right: 1px solid #222; 
            padding: 20px 10px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
        }
        .forum-chat-area {
            flex-grow: 1; display: flex; flex-direction: column; padding: 25px; gap: 15px; background: #141414;
        }
        .forum-chat-area h2 { color: #fff; font-size: 1.3rem; margin-bottom: 5px; }
        
        /* Кнопки категорий */
        .category-group { display: flex; flex-direction: column; gap: 5px; }
        .category-title { color: #76b900; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; padding-left: 10px; margin-bottom: 5px; letter-spacing: 0.5px; }
        .category-btn { 
            background: transparent; border: none; color: #9ca3af; text-align: left; 
            padding: 10px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        .category-btn:hover { background: #1c1c1c; color: #fff; }
        .category-btn.active { background: #76b900; color: #000; font-weight: bold; }

        .messages-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 10px; background: #0b0b0b; border: 1px solid #222; border-radius: 6px; padding: 15px; }
        .post { display: flex; gap: 12px; }
        .post img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333; object-fit: cover; }
        .post-content { display: flex; flex-direction: column; gap: 3px; }
        .post-author { color: #76b900; font-weight: bold; font-size: 0.85rem; }
        .post-text { color: #d1d5db; font-size: 0.95rem; word-break: break-word; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area input { flex-grow: 1; background: #0b0b0b; border: 1px solid #222; padding: 12px; border-radius: 4px; color: #fff; outline: none; }
        .chat-input-area input:focus { border-color: #76b900; }
        .chat-input-area button { background: #76b900; color: #000; border: none; padding: 0 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .forum-sidebar::-webkit-scrollbar { width: 4px; }
        .forum-sidebar::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="rgb-line"></div>
    <div class="auth-nav" id="authNav"></div>

    <div class="container" id="mainContainer">
        <h1 class="brand-title">skebob<span>.vip</span></h1>
        <div class="download-box">
            <a href="https://raw.githubusercontent.com/c6189246-glitch/skebob.github.io/main/script.lua" download="skebob_trashtalk.lua" class="download-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Script
            </a>
        </div>
    </div>

    <!-- Модалки Авторизации -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <h2>Create Account</h2>
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPass" placeholder="Password">
            <input type="text" id="regInvite" placeholder="Invite Code">
            <button onclick="handleRegister()">Register</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>Sign In</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <!-- Окно Профиля -->
    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="dashboard-content">
            <div class="close-dashboard" onclick="closeModals()">×</div>
            <div class="profile-header">
                <img id="profileAvatar" src="https://via.placeholder.com/80/0b0b0b/76b900?text=VIP" alt="Avatar" class="profile-avatar">
                <div class="profile-info">
                    <h2 id="userEmailDisplay">loading...</h2>
                    <span class="vip-badge">VIP STATUS: ACTIVE</span>
                </div>
            </div>
            <div class="profile-settings">
                <input type="text" id="nicknameInput" placeholder="Новый никнейм">
                <input type="text" id="avatarUrlInput" placeholder="Прямая ссылка на PNG/JPG">
                <button class="save-btn" onclick="handleUpdateProfile()">Save Profile</button>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <!-- НОВОЕ Окно Форума с разделами -->
    <div class="dashboard-overlay" id="forumOverlay">
        <div class="forum-content">
            
            <!-- Боковое меню -->
            <div class="forum-sidebar">
                <div class="category-group">
                    <button class="category-btn active" onclick="switchCategory('general', 'Просто общение')" id="btn-general">💬 Просто общение</button>
                </div>
                
                <div class="category-group">
                    <span class="category-title">GAMESENSE</span>
                    <button class="category-btn" onclick="switchCategory('gs_issues', 'Gamesense: Проблемы')" id="btn-gs_issues">Проблемы</button>
                    <button class="category-btn" onclick="switchCategory('gs_cfg', 'Gamesense: CFG')" id="btn-gs_cfg">Обмен CFG</button>
                    <button class="category-btn" onclick="switchCategory('gs_lua', 'Gamesense: LUA')" id="btn-gs_lua">LUA Скрипты</button>
                </div>

                <div class="category-group">
                    <span class="category-title">NEVERLOSE</span>
                    <button class="category-btn" onclick="switchCategory('nl_issues', 'Neverlose: Проблемы')" id="btn-nl_issues">Проблемы</button>
                    <button class="category-btn" onclick="switchCategory('nl_cfg', 'Neverlose: CFG')" id="btn-nl_cfg">Обмен CFG</button>
                    <button class="category-btn" onclick="switchCategory('nl_lua', 'Neverlose: LUA')" id="btn-nl_lua">LUA Скрипты</button>
                </div>
            </div>

            <!-- Зона чата -->
            <div class="forum-chat-area">
                <div class="close-dashboard" onclick="closeModals()">×</div>
                <h2 id="currentForumTitle">Просто общение</h2>
                <div class="messages-container" id="messagesContainer">
                    <!-- Сообщения грузятся сюда -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="postInput" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') handleSendPost()">
                    <button onclick="handleSendPost()">Send</button>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let unsubscribeForum = null;
        window.currentForumCategory = 'general'; // По умолчанию открыт General чат

        window.openModal = function(modalId) {
            closeModals();
            document.getElementById(modalId).style.display = 'flex';
            if(modalId === 'forumOverlay') {
                loadForumPosts();
            }
        }

        window.closeModals = function() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dashboardOverlay').style.display = 'none';
            document.getElementById('forumOverlay').style.display = 'none';
            
            if(unsubscribeForum) {
                unsubscribeForum();
                unsubscribeForum = null;
            }
        }

        // --- ЛОГИКА ПЕРЕКЛЮЧЕНИЯ КАТЕГОРИЙ ---
        window.switchCategory = function(categoryId, categoryTitle) {
            window.currentForumCategory = categoryId;
            document.getElementById('currentForumTitle').textContent = categoryTitle;
            
            // Убираем класс active у всех кнопок
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            // Добавляем active нажатой кнопке
            document.getElementById('btn-' + categoryId).classList.add('active');

            // Перезагружаем сообщения для новой категории
            loadForumPosts();
        }

        window.handleSendPost = async function() {
            const input = document.getElementById('postInput');
            const text = input.value.trim();
            if (!text || !auth.currentUser) return;
            
            const user = auth.currentUser;
            const displayName = user.displayName ? user.displayName : user.email.split('@')[0];
            const photoURL = user.photoURL ? user.photoURL : "https://via.placeholder.com/80/0b0b0b/76b900?text=VIP";

            try {
                // Пишем в коллекцию, которая зависит от выбранной категории (например "forum_gs_cfg")
                const collectionName = "forum_" + window.currentForumCategory;
                await addDoc(collection(db, collectionName), {
                    text: text,
                    author: displayName,
                    avatar: photoURL,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            } catch (error) {
                alert('Ошибка отправки: ' + error.message);
            }
        }

        function loadForumPosts() {
            const container = document.getElementById('messagesContainer');
            
            // Если мы уже слушали другой чат - отключаем прослушивание
            if(unsubscribeForum) {
                unsubscribeForum();
            }

            const collectionName = "forum_" + window.currentForumCategory;
            const q = query(collection(db, collectionName), orderBy("createdAt", "asc"));
            
            unsubscribeForum = onSnapshot(q, (snapshot) => {
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <img src="${post.avatar}" alt="ava">
                        <div class="post-content">
                            <span class="post-author">${post.author}</span>
                            <span class="post-text">${post.text}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        // --- АВТОРИЗАЦИЯ И ПРОФИЛЬ (БЕЗ ИЗМЕНЕНИЙ) ---
        window.handleRegister = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const code = document.getElementById('regInvite').value.trim();
            if (!email || !pass || !code) return;
            try {
                const inviteRef = doc(db, "invites", code);
                const inviteSnap = await getDoc(inviteRef);
                if (!inviteSnap.exists() || inviteSnap.data().used) {
                    alert('Ошибка: Инвайт-код не существует или уже использован!'); return;
                }
                await createUserWithEmailAndPassword(auth, email, pass);
                await updateDoc(inviteRef, { used: true });
                alert('Успешно зарегистрировано!'); closeModals();
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

        window.handleLogin = async function() {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
                closeModals();
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

        window.handleLogout = async function() { await signOut(auth); closeModals(); }

        window.handleUpdateProfile = async function() {
            const url = document.getElementById('avatarUrlInput').value.trim();
            const nickname = document.getElementById('nicknameInput').value.trim();
            const updateData = {};
            if (url) updateData.photoURL = url;
            if (nickname) updateData.displayName = nickname;
            if (Object.keys(updateData).length === 0) return;
            try {
                await updateProfile(auth.currentUser, updateData);
                if (url) document.getElementById('profileAvatar').src = url;
                if (nickname) document.getElementById('userEmailDisplay').textContent = nickname;
                document.getElementById('avatarUrlInput').value = '';
                document.getElementById('nicknameInput').value = '';
                alert('Профиль обновлен!');
            } catch (error) { alert('Ошибка: ' + error.message); }
        }

        onAuthStateChanged(auth, (user) => {
            const authNav = document.getElementById('authNav');
            if (user) {
                authNav.innerHTML = `<a onclick="openModal('forumOverlay')">Forum</a> <a onclick="openModal('dashboardOverlay')">Profile</a> <a onclick="handleLogout()">Logout</a>`;
                document.getElementById('userEmailDisplay').textContent = user.displayName ? user.displayName : user.email;
                document.getElementById('profileAvatar').src = user.photoURL ? user.photoURL : "https://via.placeholder.com/80/0b0b0b/76b900?text=VIP";
            } else {
                authNav.innerHTML = `<a onclick="openModal('registerModal')">Register</a> <a onclick="openModal('loginModal')">Login</a>`;
                closeModals();
            }
        });
    </script>
</body>
</html>
