<!DOCTYPE html>

<head>

    <style>
        :root {
            --bg-deep: #0e0e0e;
            --bg-box: #222222;
            --bg-header: #2c2c2c;
            --bg-nav: #2a2a2a;
            --bg-input: #1a1a1a;
            --border-dark: #111111;
            --border-light: #333333;
            --text-main: #cccccc;
            --text-muted: #aaaaaa;
            --legend-blue: #5b84a9;
            --accent-green: #8acc14; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Verdana, Arial, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; font-size: 11px; }
        .top-line { height: 2px; width: 100%; background: linear-gradient(90deg, #111 0%, var(--accent-green) 50%, #111 100%); position: fixed; top: 0; left: 0; z-index: 1000; }
        .landing-container { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; user-select: none; }
        .landing-logo, .landing-logo span { font-size: 72px !important; font-weight: normal; letter-spacing: 2px; cursor: pointer; transition: transform 0.2s, text-shadow 0.2s; text-align: center; line-height: 1; }
        .landing-logo:hover { transform: scale(1.03); text-shadow: 0 0 35px rgba(138, 204, 20, 0.5); }
        .landing-logo .white { color: #ffffff !important; }
        .landing-logo .green { color: var(--accent-green) !important; }
        .forum-wrapper { width: 95%; max-width: 960px; margin: 25px auto 40px auto; display: none; }
        .f-box { background: var(--bg-box); border: 1px solid var(--border-dark); margin-bottom: 12px; border-radius: 2px; }
        .f-header { background: var(--bg-header); padding: 7px 12px; font-weight: bold; color: #dddddd; border-bottom: 1px solid var(--border-dark); font-size: 11px; }
        .f-content { padding: 14px 18px; border-top: 1px solid var(--border-light); }
        .f-nav { background: var(--bg-nav); border: 1px solid var(--border-dark); padding: 6px 12px; display: flex; gap: 12px; font-size: 10px; margin-top: 10px; margin-bottom: 8px; }
        .f-nav a { color: var(--text-main); text-decoration: none; font-weight: normal; font-size: 10px; }
        .f-nav a:hover { color: #ffffff; text-decoration: underline; }
        .f-nav a.active { font-weight: bold; color: #ffffff; }
        .f-status { color: #bbbbbb; font-size: 10px; }
        .f-fieldset { border: 1px solid var(--border-light); padding: 10px 14px; margin-bottom: 12px; border-radius: 2px; }
        .f-legend { color: var(--legend-blue); padding: 0 4px; font-size: 10px; margin-left: 5px; }
        .f-btn { background: linear-gradient(to bottom, #2a2a2a, #1a1a1a); color: #cccccc; border: 1px solid #000000; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); border-radius: 2px; padding: 4px 12px; font-weight: bold; cursor: pointer; font-size: 10px; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
        .f-btn:hover { background: linear-gradient(to bottom, #333333, #222222); color: #ffffff; border-color: #333333; }
        .f-text { color: var(--text-muted); font-size: 10px; margin-top: 3px; margin-bottom: 3px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="top-line"></div>
    <div class="landing-container" id="landingPage">
        <div class="landing-logo" onclick="openForum()">
            <span class="white">skebob</span><span class="green">.vip</span>
        </div>
    </div>
    <div class="forum-wrapper" id="forumWrapper">
        <div class="f-box">
            <div class="f-content" style="padding: 10px 14px;">
                <div style="font-size: 22px; cursor: pointer;" onclick="closeForum()">
                    <span style="color: #fff;">skebob</span><span style="color: #8acc14;">.vip</span>
                </div>
                <div class="f-nav" id="navBar"></div>
                <div class="f-status" id="statusText">You are not logged in.</div>
            </div>
        </div>
        <div class="f-box" id="indexLoggedOut" style="display: none;">
            <div class="f-header">Info</div>
            <div class="f-content">
                <div class="f-text" style="color: #cccccc; margin-bottom: 8px;">You do not have permission to view these forums.</div>
                <a href="login.html" style="color: var(--legend-blue); text-decoration: none;">Go to Login</a>
            </div>
        </div>
        <div class="f-box" id="indexLoggedIn" style="display: none;">
            <div class="f-header">Information</div>
            <div class="f-content">
                <fieldset class="f-fieldset">
                    <legend class="f-legend">skebob.vip Loader & Scripts</legend>
                    <div class="f-text" style="margin-bottom: 10px;">Welcome to skebob.vip. You can download the official lua script below.</div>
                    <a href="#" onclick="downloadScript(event)" class="f-btn">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8acc14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download LUA Script
                    </a>
                </fieldset>
            </div>
        </div>
        <div class="f-box" style="margin-top: 6px;">
            <div class="f-content" style="padding: 8px 12px; font-size: 10px; color: #888888; border: none;">skebob.vip 2026</div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.openForum = function() {
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('forumWrapper').style.display = 'block';
        }
        window.closeForum = function() {
            document.getElementById('forumWrapper').style.display = 'none';
            document.getElementById('landingPage').style.display = 'flex';
        }
        window.downloadScript = async function(e) {
            if (e) e.preventDefault();
            const fileUrl = 'https://raw.githubusercontent.com/c6189246-glitch/skebob.github.io/main/script.lua';
            try {
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'skebob_trashtalk.lua';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                window.open(fileUrl, '_blank');
            }
        }

        onAuthStateChanged(auth, async (user) => {
            const navBar = document.getElementById('navBar');
            const statusText = document.getElementById('statusText');
            const indexLoggedOut = document.getElementById('indexLoggedOut');
            const indexLoggedIn = document.getElementById('indexLoggedIn');
            
            if (user) {
                navBar.innerHTML = `
                    <a href="index.html" class="active">Index</a>
                    <a href="profile.html">User Control Panel</a>
                `;
                statusText.textContent = `Welcome back, ${user.displayName ? user.displayName : user.email}`;
                indexLoggedOut.style.display = 'none';
                indexLoggedIn.style.display = 'block';
            } else {
                navBar.innerHTML = `
                    <a href="index.html" class="active">Index</a>
                    <a href="register.html">Register</a>
                    <a href="login.html">Login</a>
                `;
                statusText.textContent = `You are not logged in.`;
                indexLoggedIn.style.display = 'none';
                indexLoggedOut.style.display = 'block';
            }
        });
    </script>

</html>
