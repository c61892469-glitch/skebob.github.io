<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skebob.vip</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAALElEQVQ4T2NkwAIYoZgBwxj/48EcRgaGBhDjkAGwGQOgzgBlwKgDM0A1AwBy3AUF7UvPqAAAAABJRU5ErkJggg==">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #d1d5db;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rgb-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: rgbAnimation 8s ease infinite;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        @keyframes rgbAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-nav {
            position: fixed;
            top: 15px;
            right: 25px;
            display: flex;
            gap: 15px;
            z-index: 100;
            font-size: 0.85rem;
        }

        .auth-nav a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }

        .auth-nav a:hover {
            color: #ffffff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand-title span {
            color: #76b900;
        }

        .download-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .download-btn {
            background: #141414;
            border: 1px solid #222;
            color: #9ca3af;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: #1c1c1c;
            color: #ffffff;
            border-color: #333;
            transform: translateY(-2px);
        }

        .download-btn svg {
            stroke: currentColor;
        }

        .counter-text {
            font-size: 0.8rem;
            color: #555;
        }

        .counter-text span {
            color: #76b900;
            font-weight: 600;
        }

        .modal-overlay, .dashboard-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 11, 0.95);
            z-index: 500;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-box {
            background: #141414;
            border: 1px solid #222;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-box h2 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .modal-box input {
            background: #0b0b0b;
            border: 1px solid #222;
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-box input:focus {
            border-color: #76b900;
        }

        .modal-box button {
            background: #76b900;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .modal-box button:hover {
            opacity: 0.9;
        }

        .modal-box .close-link {
            font-size: 0.8rem;
            color: #777;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }

        .modal-box .close-link:hover {
            color: #fff;
        }

        .dashboard-content {
            background: #141414;
            border: 1px solid #222;
            padding: 40px;
            border-radius: 8px;
            width: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dashboard-content h2 {
            color: #fff;
            font-size: 1.5rem;
        }

        .dashboard-content p {
            color: #9ca3af;
            font-size: 0.9rem;
        }

        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="rgb-line"></div>

    <div class="auth-nav" id="authNav">
        <a onclick="openModal('registerModal')">Register</a>
        <a onclick="openModal('loginModal')">Login</a>
    </div>

    <div class="container" id="mainContainer">
        <h1 class="brand-title">skebob<span>.vip</span></h1>

        <div class="download-box">
            <!-- Прямая ссылка на файл script.lua с твоего GitHub Pages -->
            <a href="script.lua" download="skebob_trashtalk.lua" class="download-btn" id="downloadBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download
            </a>
            <div class="counter-text"><span id="count">0</span></div>
        </div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <h2>Create Account</h2>
            <input type="email" id="regEmail" placeholder="Email (e.g. name@mail.com)">
            <input type="password" id="regPass" placeholder="Password (min. 6 chars)">
            <button onclick="handleRegister()">Register</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>Sign In</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="dashboard-content">
            <h2>Welcome back, <span id="userEmailDisplay" style="color: #76b900;"></span>!</h2>
            <p>You have active cloud VIP access to skebob.vip scripts.</p>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwMHj9cVCPGPhV63CDj1wedOXdbXpkE8",
            authDomain: "skebob-vip.firebaseapp.com",
            projectId: "skebob-vip",
            storageBucket: "skebob-vip.firebasestorage.app",
            messagingSenderId: "763789977738",
            appId: "1:763789977738:web:accf6d796bfbf7944ba573"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.openModal = function(modalId) {
            closeModals();
            document.getElementById(modalId).style.display = 'flex';
        }

        window.closeModals = function() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('loginModal').style.display = 'none';
        }

        function validateInput(email, pass) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Введите корректный email (например: user@mail.com)');
                return false;
            }
            if (pass.length < 6) {
                alert('Пароль должен быть не менее 6 символов!');
                return false;
            }
            return true;
        }

        window.handleRegister = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            
            if (!validateInput(email, pass)) return;

            try {
                await createUserWithEmailAndPassword(auth, email, pass);
                alert('Аккаунт успешно создан!');
                closeModals();
            } catch (error) {
                alert('Ошибка регистрации: ' + error.message);
            }
        }

        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeModals();
            } catch (error) {
                alert('Ошибка входа: ' + error.message);
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
            document.getElementById('dashboardOverlay').style.display = 'none';
        }

        onAuthStateChanged(auth, (user) => {
            const authNav = document.getElementById('authNav');
            const dashboardOverlay = document.getElementById('dashboardOverlay');
            
            if (user) {
                authNav.innerHTML = `<a onclick="document.getElementById('dashboardOverlay').style.display='flex'">Dashboard</a> <a onclick="handleLogout()">Logout</a>`;
                document.getElementById('userEmailDisplay').textContent = user.email;
            } else {
                authNav.innerHTML = `<a onclick="openModal('registerModal')">Register</a> <a onclick="openModal('loginModal')">Login</a>`;
                dashboardOverlay.style.display = 'none';
            }
        });

        const downloadBtn = document.getElementById('downloadBtn');
        const countSpan = document.getElementById('count');
        const namespace = 'skebob-vip-downloads';
        const key = 'script-lua';

        fetch(`https://api.countapi.xyz/get/${namespace}/${key}`)
            .then(res => res.json())
            .then(data => { countSpan.textContent = data.value || 0; })
            .catch(() => { countSpan.textContent = '148'; });

        downloadBtn.addEventListener('click', () => {
            fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
                .then(res => res.json())
                .then(data => { countSpan.textContent = data.value; })
                .catch(() => {});
        });
    </script>
</body>
</html>
