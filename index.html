<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skebob.vip</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAALElEQVQ4T2NkwAIYoZgBwxj/48EcRgaGBhDjkAGwGQOgzgBlwKgDM0A1AwBy3AUF7UvPqAAAAABJRU5ErkJggg==">
    <style>
        /* Цветовая палитра в стиле Gamesense (Skeet) */
        :root {
            --bg-deep: #0b0b0b;
            --bg-panel: #141414;
            --border-out: #000000;
            --border-in: #2a2a2a;
            --text-main: #cccccc;
            --text-muted: #777777;
            --accent: #8acc14; /* Skeet Green */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Verdana, Arial, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Полоса сверху в стиле градиента skeet */
        .top-line { height: 2px; width: 100%; background: linear-gradient(90deg, #111 0%, var(--accent) 50%, #111 100%); position: fixed; top: 0; left: 0; z-index: 1000; }
        
        .auth-nav { position: fixed; top: 15px; right: 25px; display: flex; gap: 20px; z-index: 100; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .auth-nav a { color: var(--text-muted); text-decoration: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.1s; }
        .auth-nav a:hover { color: var(--text-main); }

        .container { display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .brand-title { font-size: 2.5rem; font-weight: normal; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 10px rgba(138, 204, 20, 0.2); }
        .brand-title span { color: var(--accent); }

        /* Стиль Gamesense: черный бордер + внутренний серый бордер */
        .gs-box { background: var(--bg-panel); border: 1px solid var(--border-out); box-shadow: inset 0 0 0 1px var(--border-in); }

        .download-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .download-btn { 
            background: linear-gradient(to bottom, #222, #111);
            color: var(--text-main); padding: 10px 30px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 12px; text-decoration: none; font-weight: bold; 
            border: 1px solid var(--border-out); box-shadow: inset 0 0 0 1px var(--border-in); transition: 0.1s;
        }
        .download-btn:hover { box-shadow: inset 0 0 0 1px var(--accent); color: #fff; }
        .download-btn svg { stroke: var(--text-main); transition: 0.1s; }
        .download-btn:hover svg { stroke: var(--accent); }

        /* Модальные окна */
        .modal-overlay, .dashboard-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 11, 11, 0.85); z-index: 500; justify-content: center; align-items: center; flex-direction: column; }
        .modal-box { width: 320px; padding: 25px; display: flex; flex-direction: column; gap: 15px; position: relative; }
        .modal-box h2 { font-size: 14px; color: #fff; margin-bottom: 5px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid var(--border-out); padding-bottom: 10px; box-shadow: 0 1px 0 rgba(255,255,255,0.05); }
        
        /* Инпуты */
        .gs-input { background: #1a1a1a; border: 1px solid var(--border-out); box-shadow: inset 0 0 0 1px var(--border-in); padding: 10px; color: #ccc; font-size: 11px; outline: none; transition: 0.1s; font-family: Tahoma, sans-serif; }
        .gs-input:focus { box-shadow: inset 0 0 0 1px var(--accent); color: #fff; }
        
        /* Кнопки */
        .gs-btn { background: linear-gradient(to bottom, #262626, #1a1a1a); color: #ccc; border: 1px solid var(--border-out); box-shadow: inset 0 0 0 1px var(--border-in); padding: 10px; font-weight: bold; cursor: pointer; transition: 0.1s; font-size: 11px; text-transform: uppercase; }
        .gs-btn:hover { box-shadow: inset 0 0 0 1px var(--accent); color: #fff; }
        
        .modal-box .close-link { font-size: 10px; color: var(--text-muted); text-align: center; cursor: pointer; text-decoration: none; margin-top: 5px; text-transform: uppercase; }
        .modal-box .close-link:hover { color: var(--text-main); }
        
        .close-btn { position: absolute; top: 20px; right: 20px; color: var(--text-muted); cursor: pointer; font-size: 14px; transition: 0.1s; font-weight: bold; }
        .close-btn:hover { color: #fff; }

        /* Профиль */
        .dashboard-content { width: 400px; padding: 30px; display: flex; flex-direction: column; gap: 20px; position: relative; }
        .profile-header { display: flex; align-items: center; gap: 15px; }
        .profile-avatar { width: 64px; height: 64px; border: 1px solid var(--border-out); box-shadow: inset 0 0 0 1px var(--border-in); object-fit: cover; background: #1a1a1a; }
        .profile-info { display: flex; flex-direction: column; gap: 5px; }
        .profile-info h2 { color: #fff; font-size: 14px; margin: 0; letter-spacing: 1px; border: none; padding: 0; box-shadow: none; }
        .profile-info span { font-size: 11px; color: var(--accent); }
        
        .profile-settings { border-top: 1px solid var(--border-out); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <div class="top-line"></div>
    <div class="auth-nav" id="authNav"></div>

    <div class="container" id="mainContainer">
        <h1 class="brand-title">skebob<span>.vip</span></h1>
        <div class="download-box">
            <a href="https://raw.githubusercontent.com/c6189246-glitch/skebob.github.io/main/script.lua" download="skebob_trashtalk.lua" class="download-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download LUA
            </a>
        </div>
    </div>

    <!-- Модалка Регистрации -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-box gs-box">
            <h2>Register</h2>
            <input type="email" id="regEmail" class="gs-input" placeholder="Email">
            <input type="password" id="regPass" class="gs-input" placeholder="Password">
            <input type="text" id="regInvite" class="gs-input" placeholder="Invite Code">
            <button class="gs-btn" onclick="handleRegister()">Create Account</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <!-- Модалка Логина -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box gs-box">
            <h2>Login</h2>
            <input type="email" id="loginEmail" class="gs-input" placeholder="Email">
            <input type="password" id="loginPass" class="gs-input" placeholder="Password">
            <button class="gs-btn" onclick="handleLogin()">Sign In</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <!-- Окно Профиля -->
    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="dashboard-content gs-box">
            <div class="close-btn" onclick="closeModals()">×</div>
            <div class="profile-header">
                <img id="profileAvatar" src="https://via.placeholder.com/64/1a1a1a/8acc14?text=U" alt="Avatar" class="profile-avatar">
                <div class="profile-info">
                    <h2 id="userEmailDisplay">loading...</h2>
                    <span>UID: Active</span>
                </div>
            </div>
            <div class="profile-settings">
                <input type="text" id="nicknameInput" class="gs-input" placeholder="New Username">
                <input type="text" id="avatarUrlInput" class="gs-input" placeholder="Avatar Image URL">
                <button class="gs-btn" onclick="handleUpdateProfile()">Save Settings</button>
            </div>
            <button class="gs-btn" style="color: #ff4444;" onclick="handleLogout()">Log Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.openModal = function(modalId) {
            closeModals();
            document.getElementById(modalId).style.display = 'flex';
        }

        window.closeModals = function() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dashboardOverlay').style.display = 'none';
        }

        window.handleRegister = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const code = document.getElementById('regInvite').value.trim();
            if (!email || !pass || !code) return;
            try {
                const inviteRef = doc(db, "invites", code);
                const inviteSnap = await getDoc(inviteRef);
                if (!inviteSnap.exists() || inviteSnap.data().used) { alert('Invalid or used invite code!'); return; }
                await createUserWithEmailAndPassword(auth, email, pass);
                await updateDoc(inviteRef, { used: true });
                closeModals();
            } catch (error) { alert('Error: ' + error.message); }
        }

        window.handleLogin = async function() {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
                closeModals();
            } catch (error) { alert('Error: ' + error.message); }
        }

        window.handleLogout = async function() { await signOut(auth); closeModals(); }

        window.handleUpdateProfile = async function() {
            const url = document.getElementById('avatarUrlInput').value.trim();
            const nickname = document.getElementById('nicknameInput').value.trim();
            const updateData = {};
            if (url) updateData.photoURL = url;
            if (nickname) updateData.displayName = nickname;
            if (Object.keys(updateData).length === 0) return;
            try {
                await updateProfile(auth.currentUser, updateData);
                if (url) document.getElementById('profileAvatar').src = url;
                if (nickname) document.getElementById('userEmailDisplay').textContent = nickname;
                document.getElementById('avatarUrlInput').value = '';
                document.getElementById('nicknameInput').value = '';
            } catch (error) { alert('Error: ' + error.message); }
        }

        onAuthStateChanged(auth, (user) => {
            const authNav = document.getElementById('authNav');
            if (user) {
                authNav.innerHTML = `<a onclick="openModal('dashboardOverlay')">User Panel</a>`;
                document.getElementById('userEmailDisplay').textContent = user.displayName ? user.displayName : user.email;
                document.getElementById('profileAvatar').src = user.photoURL ? user.photoURL : "https://via.placeholder.com/64/1a1a1a/8acc14?text=U";
            } else {
                authNav.innerHTML = `<a onclick="openModal('registerModal')">Register</a> <a onclick="openModal('loginModal')">Login</a>`;
                closeModals();
            }
        });
    </script>
</body>
</html>
