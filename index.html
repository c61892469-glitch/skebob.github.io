<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skebob VIP - Регистрация</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #141419;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 320px;
            border: 1px solid #22222c;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #b0ff00;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1e1e26;
            border: 1px solid #2e2e3d;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #b0ff00;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #b0ff00;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #9be000;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Skebob VIP</h2>
        <form id="registerForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <input type="text" id="inviteCode" placeholder="Инвайт-код" required>
            <button type="submit">Register</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById('registerForm');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('inviteCode').value.trim();

            try {
                // 1. Проверяем инвайт-код в Firestore
                const inviteRef = doc(db, "invites", code);
                const inviteSnap = await getDoc(inviteRef);

                if (!inviteSnap.exists()) {
                    alert("Ошибка: такого инвайт-кода не существует!");
                    return;
                }

                const inviteData = inviteSnap.data();
                if (inviteData.used) {
                    alert("Ошибка: этот инвайт-код уже был использован!");
                    return;
                }

                // 2. Создаем пользователя в Firebase Auth
                await createUserWithEmailAndPassword(auth, email, password);

                // 3. Помечаем инвайт как использованный
                await updateDoc(inviteRef, { used: true });

                alert("Успех! Регистрация прошла успешно.");
                window.location.reload();

            } catch (error) {
                alert("Ошибка регистрации: " + error.message);
            }
        });
    </script>
</body>
</html>
