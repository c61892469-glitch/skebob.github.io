<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skebob.vip</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAALElEQVQ4T2NkwAIYoZgBwxj/48EcRgaGBhDjkAGwGQOgzgBlwKgDM0A1AwBy3AUF7UvPqAAAAABJRU5ErkJggg==">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #d1d5db;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .rgb-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: rgbAnimation 8s ease infinite;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        @keyframes rgbAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-nav {
            position: fixed;
            top: 15px;
            right: 25px;
            display: flex;
            gap: 15px;
            z-index: 100;
            font-size: 0.85rem;
        }

        .auth-nav a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }

        .auth-nav a:hover {
            color: #ffffff;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .brand-title span {
            color: #76b900;
        }

        .download-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .download-btn {
            background: #141414;
            border: 1px solid #222;
            color: #9ca3af;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: #1c1c1c;
            color: #ffffff;
            border-color: #333;
            transform: translateY(-2px);
        }

        .download-btn svg {
            stroke: currentColor;
        }

        .modal-overlay, .dashboard-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 11, 0.95);
            z-index: 500;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-box {
            background: #141414;
            border: 1px solid #222;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-box h2 {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .modal-box input {
            background: #0b0b0b;
            border: 1px solid #222;
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-box input:focus {
            border-color: #76b900;
        }

        .modal-box button {
            background: #76b900;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .modal-box button:hover {
            opacity: 0.9;
        }

        .modal-box .close-link {
            font-size: 0.8rem;
            color: #777;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }

        .modal-box .close-link:hover {
            color: #fff;
        }

        /* --- Стили Профиля --- */
        .dashboard-content {
            background: #141414;
            border: 1px solid #222;
            padding: 30px;
            border-radius: 8px;
            width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #76b900;
            object-fit: cover;
            background: #0b0b0b;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .profile-info h2 {
            color: #fff;
            font-size: 1.2rem;
            margin: 0;
            word-break: break-all;
        }

        .vip-badge {
            background: rgba(118, 185, 0, 0.15);
            color: #76b900;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid #76b900;
            align-self: flex-start;
            letter-spacing: 0.5px;
        }

        .profile-settings {
            border-top: 1px solid #222;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .profile-settings input {
            background: #0b0b0b;
            border: 1px solid #222;
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .profile-settings input:focus {
            border-color: #76b900;
        }

        .save-btn {
            background: #1c1c1c;
            color: #9ca3af;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .save-btn:hover {
            background: #76b900;
            color: #000;
            border-color: #76b900;
        }

        .logout-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: #fff;
        }
        
        .close-dashboard {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #777;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.2s;
        }
        
        .close-dashboard:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="rgb-line"></div>

    <div class="auth-nav" id="authNav">
        <!-- Кнопки обновляются через JS -->
    </div>

    <div class="container" id="mainContainer">
        <h1 class="brand-title">skebob<span>.vip</span></h1>

        <div class="download-box">
            <!-- Счетчик убран, осталась только скачка -->
            <a href="https://raw.githubusercontent.com/c6189246-glitch/skebob.github.io/main/script.lua" download="skebob_trashtalk.lua" class="download-btn" id="downloadBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Script
            </a>
        </div>
    </div>

    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <h2>Create Account</h2>
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPass" placeholder="Password">
            <input type="text" id="regInvite" placeholder="Invite Code">
            <button onclick="handleRegister()">Register</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>Sign In</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="handleLogin()">Login</button>
            <span class="close-link" onclick="closeModals()">Cancel</span>
        </div>
    </div>

    <!-- Обновленный Профиль (Dashboard) -->
    <div class="dashboard-overlay" id="dashboardOverlay">
        <div class="close-dashboard" onclick="document.getElementById('dashboardOverlay').style.display='none'">×</div>
        <div class="dashboard-content">
            
            <div class="profile-header">
                <img id="profileAvatar" src="https://i.imgur.com/6M3GDei.png" alt="Avatar" class="profile-avatar">
                <div class="profile-info">
                    <h2 id="userEmailDisplay">loading...</h2>
                    <span class="vip-badge">VIP STATUS: ACTIVE</span>
                </div>
            </div>

            <div class="profile-settings">
                <input type="text" id="avatarUrlInput" placeholder="URL картинки (нажми Save)">
                <button class="save-btn" onclick="handleUpdateAvatar()">Save Avatar</button>
            </div>

            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        // Добавили updateProfile в импорты!
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.openModal = function(modalId) {
            closeModals();
            document.getElementById(modalId).style.display = 'flex';
        }

        window.closeModals = function() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dashboardOverlay').style.display = 'none';
        }

        window.handleRegister = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const code = document.getElementById('regInvite').value.trim();

            if (!email || !pass || !code) {
                alert('Please fill in all fields!');
                return;
            }

            try {
                const inviteRef = doc(db, "invites", code);
                const inviteSnap = await getDoc(inviteRef);

                if (!inviteSnap.exists()) {
                    alert('Error: Invite code does not exist!');
                    return;
                }

                const inviteData = inviteSnap.data();
                if (inviteData.used) {
                    alert('Error: This invite code has already been used!');
                    return;
                }

                await createUserWithEmailAndPassword(auth, email, pass);
                await updateDoc(inviteRef, { used: true });

                alert('Account successfully created!');
                closeModals();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeModals();
                document.getElementById('dashboardOverlay').style.display = 'flex';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
            document.getElementById('dashboardOverlay').style.display = 'none';
        }

        // Новая функция для обновления аватарки
        window.handleUpdateAvatar = async function() {
            const url = document.getElementById('avatarUrlInput').value.trim();
            if (!url) return;
            
            try {
                await updateProfile(auth.currentUser, {
                    photoURL: url
                });
                document.getElementById('profileAvatar').src = url;
                document.getElementById('avatarUrlInput').value = '';
                alert('Avatar updated successfully!');
            } catch (error) {
                alert('Error updating avatar: ' + error.message);
            }
        }

        onAuthStateChanged(auth, (user) => {
            const authNav = document.getElementById('authNav');
            const dashboardOverlay = document.getElementById('dashboardOverlay');
            
            if (user) {
                authNav.innerHTML = `<a onclick="document.getElementById('dashboardOverlay').style.display='flex'">Profile</a> <a onclick="handleLogout()">Logout</a>`;
                document.getElementById('userEmailDisplay').textContent = user.email;
                
                // Ставим аватарку, если она уже задана, иначе дефолтную темную
                document.getElementById('profileAvatar').src = user.photoURL ? user.photoURL : "https://i.imgur.com/6M3GDei.png";
            } else {
                authNav.innerHTML = `<a onclick="openModal('registerModal')">Register</a> <a onclick="openModal('loginModal')">Login</a>`;
                dashboardOverlay.style.display = 'none';
            }
        });
    </script>
</body>
</html>
