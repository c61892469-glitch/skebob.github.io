<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skebob VIP</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #141419;
            --accent: #b0ff00;
            --text-main: #ffffff;
            --text-muted: #888898;
            --border: #22222c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .form-container {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            width: 360px;
            border: 1px solid var(--border);
            position: relative;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 22px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            background: #1e1e26;
            border: 1px solid #2e2e3d;
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(176, 255, 0, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #9be000;
            box-shadow: 0 0 15px rgba(176, 255, 0, 0.4);
        }

        .status-message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Skebob VIP</h2>
        <form id="registerForm">
            <input type="email" id="email" placeholder="Электронная почта" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <input type="text" id="inviteCode" placeholder="Инвайт-код" required>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div id="status" class="status-message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIuo4ppSQoskPiMkqLrDqSah2ph4ZJl10",
            authDomain: "skebob-vip-4aa40.firebaseapp.com",
            projectId: "skebob-vip-4aa40",
            storageBucket: "skebob-vip-4aa40.firebasestorage.app",
            messagingSenderId: "853888273098",
            appId: "1:853888273098:web:d46ec3bbb556693edd4233"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const registerForm = document.getElementById('registerForm');
        const statusDiv = document.getElementById('status');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const code = document.getElementById('inviteCode').value.trim();

            statusDiv.style.color = "var(--text-muted)";
            statusDiv.textContent = "Проверка инвайт-кода...";

            try {
                // 1. Проверяем инвайт в Firestore
                const inviteRef = doc(db, "invites", code);
                const inviteSnap = await getDoc(inviteRef);

                if (!inviteSnap.exists()) {
                    statusDiv.style.color = "#ff4d4d";
                    statusDiv.textContent = "Ошибка: такого инвайт-кода не существует!";
                    return;
                }

                const inviteData = inviteSnap.data();
                if (inviteData.used) {
                    statusDiv.style.color = "#ff4d4d";
                    statusDiv.textContent = "Ошибка: этот инвайт-код уже использован!";
                    return;
                }

                statusDiv.textContent = "Создание аккаунта...";

                // 2. Создаем пользователя в Firebase Auth
                await createUserWithEmailAndPassword(auth, email, password);

                // 3. Помечаем инвайт как использованный
                await updateDoc(inviteRef, { used: true });

                statusDiv.style.color = "var(--accent)";
                statusDiv.textContent = "Успех! Добро пожаловать в VIP.";
                
                setTimeout(() => {
                    window.location.reload();
                }, 1500);

            } catch (error) {
                statusDiv.style.color = "#ff4d4d";
                if (error.code === 'auth/email-already-in-use') {
                    statusDiv.textContent = "Ошибка: этот email уже занят.";
                } else if (error.code === 'auth/weak-password') {
                    statusDiv.textContent = "Ошибка: пароль слишком слабый (мин. 6 символов).";
                } else {
                    statusDiv.textContent = "Ошибка: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
